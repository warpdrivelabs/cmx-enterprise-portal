<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Component HTML 可视化调试器</title>
  <!-- 先于模块：防止首帧自定义元素默认 inline / 外部 display 覆盖 shadow :host{display:grid} 撑坏高度链（与 CMXPortalManager index.html 同思路） -->
  <style id="debug-layout-critical">
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .debug-host {
      display: flex;
      flex-direction: column;
      flex: 1 1 0%;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      box-sizing: border-box;
    }
    cmx-debug-portal-body,
    cmx-debug-portal-body.debug-host__workspace {
      display: grid;
      flex: 1 1 0%;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      box-sizing: border-box;
    }
  </style>
  <script type="module" src="/src/run-main.js"></script>
</head>
<body class="ui5-content-density-compact"></body>
</html>
